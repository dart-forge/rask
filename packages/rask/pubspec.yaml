name: rask
description: Workspace-aware task runner for Dart — the library. Write tasks in rask.dart with package:rask/rask.dart; the command is package:rask_cli.
version: 0.1.0
repository: https://github.com/dart-forge/rask
resolution: workspace

environment:
  sdk: ^3.13.0

# Add regular dependencies here.
dependencies:
  args: ^2.7.0
  crypto: ^3.0.6
  glob: ^2.1.3
  path: ^1.9.1
  yaml: ^3.1.4
  yaml_edit: ^2.2.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
