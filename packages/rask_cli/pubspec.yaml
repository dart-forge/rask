name: rask_cli
description: The rask command. Installs the `rask` executable; the library a rask.dart imports is package:rask.
version: 0.1.0
repository: https://github.com/dart-forge/rask
resolution: workspace
environment:
  sdk: ^3.13.0
executables:
  rask: rask

# Add regular dependencies here.
dependencies:
  crypto: ^3.0.6
  path: ^1.9.1
  rask: ^0.1.0
  yaml: ^3.1.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
